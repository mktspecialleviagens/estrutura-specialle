<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Painel</title>
<style>
:root{--bg:#F4F1EC;--bg2:#E4E6E5;--ink:#0F1B2D;--muted:#5A6672;--ac:#C9A24B;--acd:#8A6A22;--sec:#4A6278;--ft:Georgia,serif;--fx:system-ui,sans-serif;--fu:system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fx);-webkit-text-size-adjust:100%}
a{color:inherit}
.topo{background:var(--ink);color:var(--bg);padding:1.2rem 1.2rem 1.4rem}
.topo-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:1rem}
.topo img{width:52px;height:52px;object-fit:contain;border-radius:8px;background:rgba(255,255,255,.06)}
.topo h1{font-family:var(--ft);font-weight:500;font-size:1.55rem;margin:0;line-height:1.15}
.topo .sub{font-family:var(--fu);font-size:.78rem;opacity:.7;margin-top:.2rem;letter-spacing:.02em}
main{max-width:1080px;margin:0 auto;padding:1.2rem}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:.7rem;margin-top:-2.2rem}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border-radius:12px;padding:.9rem 1rem;box-shadow:0 8px 24px -16px rgba(0,0,0,.35)}
.kpi .n{font-family:var(--ft);font-size:1.7rem;line-height:1.1;color:var(--ink)}
.kpi .n.peq{font-size:1.15rem}
.kpi .r{font-family:var(--fu);font-size:.74rem;color:var(--muted);margin-top:.25rem;letter-spacing:.02em}
.kpi.alerta .n{color:#A33A2B}
.filtros{display:grid;gap:.6rem;margin:1.4rem 0 1rem;grid-template-columns:1fr}
@media(min-width:760px){.filtros{grid-template-columns:2fr 1fr 1fr 1fr}}
.filtros input,.filtros select{width:100%;font:inherit;font-family:var(--fu);font-size:.95rem;padding:.75rem .9rem;border-radius:10px;border:1px solid color-mix(in srgb,var(--ink) 18%,transparent);background:#fff;color:var(--ink)}
.linha{display:flex;justify-content:space-between;align-items:center;font-family:var(--fu);font-size:.8rem;color:var(--muted);margin:.2rem 0 .8rem}
.linha button{font:inherit;border:0;background:none;color:var(--acd);cursor:pointer;padding:.3rem 0}
.lista{display:grid;gap:.8rem;grid-template-columns:1fr}
@media(min-width:760px){.lista{grid-template-columns:1fr 1fr}}
.card{background:#fff;border-radius:12px;padding:1rem 1.05rem 1.05rem;border-left:4px solid var(--ac);display:grid;gap:.55rem}
.card.vencendo{border-left-color:#C77C1E}.card.vencida{border-left-color:#A33A2B}.card.perdida{border-left-color:#9AA0A6;opacity:.75}
.card .cab{display:flex;justify-content:space-between;gap:.6rem;align-items:flex-start}
.card h2{font-family:var(--ft);font-weight:500;font-size:1.2rem;margin:0;line-height:1.2}
.card .num{font-family:var(--fu);font-size:.72rem;color:var(--muted);margin-top:.15rem}
.selos{display:flex;flex-wrap:wrap;gap:.35rem;justify-content:flex-end}
.selo{font-family:var(--fu);font-size:.68rem;letter-spacing:.03em;padding:.25rem .55rem;border-radius:20px;background:var(--bg2);color:var(--ink);white-space:nowrap}
.selo.enviada,.selo.entregue{background:color-mix(in srgb,var(--sec) 16%,#fff)}
.selo.aprovada,.selo.confirmada{background:#DCEFD9;color:#1F5A2A}
.selo.rascunho{background:#EEE}
.selo.perdida{background:#ECECEC;color:#666}
.selo.vencendo{background:#FBE7CC;color:#7A4A0B}.selo.vencida{background:#F6D6D1;color:#8A2416}
.dados{font-family:var(--fu);font-size:.85rem;color:var(--muted);display:grid;gap:.15rem}
.dados b{color:var(--ink);font-weight:600}
.valor{font-family:var(--ft);font-size:1.25rem;color:var(--ink)}
.botoes{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.2rem}
.botoes a{font-family:var(--fu);font-size:.8rem;text-decoration:none;padding:.55rem .85rem;border-radius:30px;border:1px solid color-mix(in srgb,var(--ink) 22%,transparent)}
.botoes a.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.vazio{font-family:var(--fu);color:var(--muted);text-align:center;padding:2.5rem 1rem}
footer{font-family:var(--fu);font-size:.72rem;color:var(--muted);text-align:center;padding:2rem 1rem 3rem}
</style>
<style>.topo img{filter:brightness(0) invert(1);width:auto;max-width:92px;height:30px;background:none;border-radius:0}</style></head>
<body>
<header class="topo"><div class="topo-in" id="topo"></div></header>
<main>
  <section class="kpis" id="kpis"></section>
  <section class="filtros">
    <input id="busca" type="search" placeholder="Buscar cliente, destino ou número" aria-label="Buscar">
    <select id="tipo" aria-label="Tipo"><option value="">Proposta e roteiro</option><option value="proposta">Só com proposta</option><option value="roteiro">Só com roteiro</option></select>
    <select id="status" aria-label="Status"><option value="">Todos os status</option></select>
    <select id="mes" aria-label="Mês de embarque"><option value="">Todo embarque</option></select>
  </section>
  <div class="linha"><span id="conta"></span><button id="ordem" type="button">Ordenar por embarque</button></div>
  <section class="lista" id="lista"></section>
</main>
<footer id="rodape"></footer>

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var T=D.tema||{}, r=document.documentElement.style;
[['--bg',T.bg],['--bg2',T.bg_alt],['--ink',T.ink],['--muted',T.muted],['--ac',T.accent],['--acd',T.accent_dark],['--sec',T.secondary]].forEach(function(x){if(x[1])r.setProperty(x[0],x[1]);});
var fontes=[[T.f_titulo,'--ft','serif'],[T.f_texto,'--fx','serif'],[T.f_ui,'--fu','sans-serif']];
fontes.forEach(function(f){ if(!f[0])return; r.setProperty(f[1],"'"+f[0]+"',"+f[2]);

var A=D.agencia||{};
document.title='Painel | '+(A.nome||'');
document.getElementById('topo').innerHTML=(A.logo?'<img src="'+A.logo+'" alt="">':'')+'<div><h1>Painel de propostas e roteiros</h1><div class="sub">'+esc(A.nome)+' · atualizado em '+esc(D.gerado)+'</div></div>';
document.getElementById('rodape').textContent='Uso interno de '+(A.nome||'agência')+'. Os botões abrem as páginas que o cliente recebe.';

var NOMES={rascunho:'Rascunho',enviada:'Enviada',aprovada:'Aprovada',confirmada:'Confirmada',perdida:'Perdida',entregue:'Entregue',substituida:'Substituída'};
var MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function dt(s){if(!s)return '';var p=s.split('-');return p.length===3?p[2]+' '+MESES[+p[1]-1]+' '+p[0]:s;}
function dia(s){var p=(s||'').split('-');return p.length===3?new Date(+p[0],+p[1]-1,+p[2]):null;}
var hoje=new Date(); hoje.setHours(0,0,0,0);
function prazo(it){
  if(it.status_proposta!=='enviada'||!it.validade) return '';
  var v=dia(it.validade); if(!v) return '';
  var d=Math.round((v-hoje)/864e5);
  return d<0?'vencida':(d<=3?'vencendo':'');
}
function moeda(v,m){ if(v===''||v==null||isNaN(+v)) return ''; try{return new Intl.NumberFormat('pt-BR',{style:'currency',currency:m||'BRL'}).format(+v);}catch(e){return (m||'')+' '+(+v).toLocaleString('pt-BR');} }
var itens=(D.itens||[]).map(function(it){it.prazo=prazo(it); it.st=it.status_proposta||it.status_roteiro||''; return it;});

/* números do topo */
var noAr=itens.filter(function(i){return i.status_proposta==='enviada';});
var ok=itens.filter(function(i){return i.status_proposta==='aprovada'||i.status_proposta==='confirmada';});
var aberto={}; noAr.filter(function(i){return i.prazo!=='vencida';}).forEach(function(i){ if(i.valor!==''&&!isNaN(+i.valor)){ aberto[i.moeda||'BRL']=(aberto[i.moeda||'BRL']||0)+(+i.valor);} });
var venc=itens.filter(function(i){return i.prazo==='vencendo';}).length;
var abertoTxt=Object.keys(aberto).map(function(m){return moeda(aberto[m],m);}).join(' + ')||moeda(0,'BRL');
document.getElementById('kpis').innerHTML=
 '<div class="kpi"><div class="n">'+noAr.length+'</div><div class="r">Propostas no ar</div></div>'+
 '<div class="kpi"><div class="n">'+ok.length+'</div><div class="r">Aprovadas ou confirmadas</div></div>'+
 '<div class="kpi"><div class="n'+(abertoTxt.length>12?' peq':'')+'">'+esc(abertoTxt)+'</div><div class="r">Valor em aberto</div></div>'+
 '<div class="kpi'+(venc?' alerta':'')+'"><div class="n">'+venc+'</div><div class="r">Vencem em 3 dias</div></div>';

/* filtros */
var sts={}; itens.forEach(function(i){[i.status_proposta,i.status_roteiro].forEach(function(s){if(s)sts[s]=1;});});
document.getElementById('status').innerHTML+=Object.keys(sts).map(function(s){return '<option value="'+esc(s)+'">'+esc(NOMES[s]||s)+'</option>';}).join('')+'<option value="vencendo">Vencendo</option>';
var meses={}; itens.forEach(function(i){if(i.embarque)meses[i.embarque.slice(0,7)]=1;});
document.getElementById('mes').innerHTML+=Object.keys(meses).sort().map(function(m){return '<option value="'+m+'">'+MESES[+m.slice(5,7)-1]+' '+m.slice(0,4)+'</option>';}).join('');

var porEmbarque=false;
function desenhar(){
  var q=document.getElementById('busca').value.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  var tp=document.getElementById('tipo').value, st=document.getElementById('status').value, ms=document.getElementById('mes').value;
  var l=itens.filter(function(i){
    var hay=(i.cliente+' '+i.destinos+' '+i.numero).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
    if(q&&hay.indexOf(q)<0) return false;
    if(tp==='proposta'&&!i.tem_proposta) return false;
    if(tp==='roteiro'&&!i.tem_roteiro) return false;
    if(st==='vencendo'&&i.prazo!=='vencendo') return false;
    if(st&&st!=='vencendo'&&i.status_proposta!==st&&i.status_roteiro!==st) return false;
    if(ms&&(i.embarque||'').slice(0,7)!==ms) return false;
    return true;
  });
  l.sort(function(a,b){ return porEmbarque ? String(a.embarque).localeCompare(String(b.embarque)) : String(b.data).localeCompare(String(a.data)); });
  document.getElementById('conta').textContent=l.length+(l.length===1?' viagem':' viagens');
  document.getElementById('lista').innerHTML=l.length?l.map(function(i){
    var selos='';
    if(i.tem_proposta&&i.status_proposta) selos+='<span class="selo '+esc(i.status_proposta)+'">Proposta '+esc((NOMES[i.status_proposta]||i.status_proposta).toLowerCase())+'</span>';
    if(i.tem_roteiro&&i.status_roteiro) selos+='<span class="selo '+esc(i.status_roteiro)+'">Roteiro '+esc((NOMES[i.status_roteiro]||i.status_roteiro).toLowerCase())+'</span>';
    if(i.prazo) selos+='<span class="selo '+i.prazo+'">'+(i.prazo==='vencida'?'Validade vencida':'Vence em breve')+'</span>';
    var b='';
    if(i.link_proposta) b+='<a class="pri" href="'+esc(i.link_proposta)+'" target="_blank" rel="noopener">Proposta</a>';
    if(i.link_roteiro) b+='<a class="pri" href="'+esc(i.link_roteiro)+'" target="_blank" rel="noopener">Roteiro</a>';
    if(i.pasta) b+='<a href="'+esc(i.pasta)+'" target="_blank" rel="noopener">Pasta do cliente</a>';
    if(!i.link_proposta&&i.previa_proposta) b+='<a href="'+esc(i.previa_proposta)+'" target="_blank" rel="noopener">Prévia da proposta</a>';
    if(!i.link_roteiro&&i.previa_roteiro) b+='<a href="'+esc(i.previa_roteiro)+'" target="_blank" rel="noopener">Prévia do roteiro</a>';
    var cls=['card',i.prazo,(i.status_proposta==='perdida'?'perdida':'')].join(' ');
    return '<article class="'+cls+'"><div class="cab"><div><h2>'+esc(i.cliente)+'</h2><div class="num">'+esc(i.numero)+'</div></div><div class="selos">'+selos+'</div></div>'+
      '<div class="dados"><span><b>'+esc(i.destinos)+'</b></span><span>'+esc(dt(i.embarque))+(i.retorno?' até '+esc(dt(i.retorno)):'')+(i.viajantes?' · '+esc(i.viajantes)+' viajantes':'')+'</span>'+
      (i.validade&&i.tem_proposta?'<span>Validade da proposta: '+esc(dt(i.validade))+'</span>':'')+'</div>'+
      (i.valor!==''&&i.valor!=null?'<div class="valor">'+esc(moeda(i.valor,i.moeda))+'</div>':'')+
      (b?'<div class="botoes">'+b+'</div>':'')+'</article>';
  }).join(''):'<div class="vazio">Nenhuma viagem com esses filtros.</div>';
}
['busca','tipo','status','mes'].forEach(function(id){document.getElementById(id).addEventListener('input',desenhar);});
document.getElementById('ordem').addEventListener('click',function(){porEmbarque=!porEmbarque;this.textContent=porEmbarque?'Ordenar pelos mais recentes':'Ordenar por embarque';desenhar();});
desenhar();
